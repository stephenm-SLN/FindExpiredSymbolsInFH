<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}find-expired-symbols{% endblock %}</title>
    <link rel="stylesheet" href="/static/app.css">
    <script src="/static/htmx.min.js" defer></script>
</head>
<body>
    <header>
        <h1><a href="/">find-expired-symbols</a></h1>
        <nav>
            <a href="/docs">API docs</a>
            <a href="/scans">Recent scans (JSON)</a>
            <a href="/health">Health</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        <small>v{{ version }} &middot; scans run on-demand, results kept in-memory for {{ job_ttl_minutes|round|int }} min</small>
    </footer>
</body>
</html>
